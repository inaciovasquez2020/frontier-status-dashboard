name: Sync Public Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    paths:
      - ".github/workflows/sync-public-repositories.yml"
      - "scripts/update-status-data.mjs"
      - "src/data/public-repositories.json"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh public repository inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-status-data.mjs
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/status-data.json src/data/public-repositories.json
          if git diff --cached --quiet; then
            echo "Public repository inventory already current"
            exit 0
          fi
          git commit -m "dashboard: sync public repository inventory"
          git push
